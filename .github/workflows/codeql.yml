# Análisis estático de seguridad (SAST) del código TypeScript del backend y frontend.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # lunes 06:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analizar JavaScript/TypeScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/dist'

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
